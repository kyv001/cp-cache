[project]
name = "cp-cache"
version = "0.1.0"
description = "Copy the cache of SPlayer to another directory"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ffmpeg-python>=0.2.0",
]

[project.scripts]
cp-cache = "cp_cache:cli"

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cp_cache"]
